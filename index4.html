<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Интерактивное резюме</title>
<style>
:root{color-scheme:dark;--bg:#16151c;--ink:#1d1d1f;--muted:#6e6e73;--accent:#0a84ff;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,#2a2838,var(--bg));font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:grid;place-items:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);overflow:hidden}
.mon{width:min(94vw,calc((100dvh - 80px)*1.6));position:relative;padding-bottom:3.4%}
.bezel{background:#0c0c0e;border-radius:16px;padding:1.3%;box-shadow:0 30px 80px #000a,inset 0 0 0 2px #2b2b30}
.screen{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:6px;background:#000;user-select:none;-webkit-user-select:none}
.mon::after{content:"";position:absolute;left:50%;bottom:0;width:22%;height:3.4%;transform:translateX(-50%);background:linear-gradient(#55555c,#2c2c31);border-radius:0 0 12px 12px}
.wall{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%}
.menubar{position:absolute;left:0;right:0;top:0;height:1.8em;background:rgba(255,255,255,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#111;font-size:.9em;display:flex;align-items:center;gap:1.2em;padding:0 1em;z-index:9999;font-weight:500}
.menubar b{font-weight:700}.menubar .sp{flex:1}
.screen::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 55%,rgba(0,0,0,.18));pointer-events:none}.icons{position:absolute;z-index:2;right:2%;top:3.2em;bottom:3em;display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,auto);gap:1em 1.2em;align-content:start;justify-content:end}
.ic{width:6.6em;text-align:center;cursor:pointer;color:#fff;font-size:.95em;text-shadow:0 1px 3px #000c;background:none;border:0;font-family:inherit;padding:.2em}
.ic svg{width:4em;height:auto;display:block;margin:0 auto .2em;filter:drop-shadow(0 3px 4px #0006);transition:transform .15s}
.ic:hover svg{transform:scale(1.08)}
.ic:focus-visible{outline:2px solid #fff;border-radius:6px}
.hint{position:absolute;left:50%;bottom:1.2em;transform:translateX(-50%);background:rgba(0,0,0,.45);color:#fff;padding:.45em 1em;border-radius:2em;font-size:.9em;backdrop-filter:blur(6px);white-space:nowrap;transition:opacity .4s}
.win{position:absolute;width:46em;height:30em;max-width:96%;background:rgba(250,250,252,.97);color:var(--ink);border-radius:.8em;box-shadow:0 1.5em 4em #0008,0 0 0 1px #0003;display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out;font-size:1em}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.win.full{left:0!important;top:1.8em!important;width:100%!important;height:calc(100% - 1.8em)!important;max-width:none;border-radius:0}
.tb{height:2.4em;background:linear-gradient(#ececee,#dcdcde);display:flex;align-items:center;padding:0 .8em;gap:.5em;cursor:grab;border-bottom:1px solid #c8c8ca;touch-action:none;flex:none}
.tb span.t{flex:1;text-align:center;font-size:.9em;font-weight:600;color:#444;margin-right:3.4em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:.85em;height:.85em;border-radius:50%;border:0;padding:0;cursor:pointer}
.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.body{flex:1;overflow:auto;padding:1.2em 1.4em;font-size:.95em;line-height:1.55}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5em,1fr));gap:1em}
.f{background:none;border:0;font-family:inherit;text-align:center;cursor:pointer;padding:.5em .3em;border-radius:.5em;color:var(--ink);font-size:.9em}
.f:hover,.f:focus-visible{background:#0a84ff22;outline:none}
.f svg{width:3.6em;height:auto;display:block;margin:0 auto .3em}
.doc h1{margin:.1em 0 .1em;font-size:1.7em}.doc h2{font-size:1em;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border-bottom:1px solid #e3e3e6;padding-bottom:.25em;margin:1.4em 0 .5em}
.doc h3{margin:.8em 0 .1em;font-size:1em}.doc p{margin:.3em 0}.doc .m{color:var(--muted);font-size:.92em}
.doc ul{margin:.3em 0;padding-left:1.2em}
.me{float:right;width:7em;border-radius:.6em;margin:0 0 .6em 1em;box-shadow:0 .2em .8em #0003}.hb{display:flex;gap:.9em;align-items:center;margin:.8em 0;padding:.7em .9em;background:#0a84ff0d;border-radius:.7em}.hb .e{font-size:2em}mark{background:#fff3a8;color:inherit;border-radius:3px;padding:0 .15em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(10em,1fr));gap:.8em}
.tile{aspect-ratio:4/3;border-radius:.6em;display:grid;place-items:center;color:#fff;font-size:.9em;text-align:center;padding:.5em;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.chips span{display:inline-block;background:#0a84ff18;color:#0a60c0;border-radius:2em;padding:.15em .7em;margin:.15em .2em .15em 0;font-size:.92em}
.m-on .mon{width:100vw;padding:0}.m-on .bezel{padding:0;border-radius:0;box-shadow:none}.m-on .mon::after{display:none}
.m-on .screen{aspect-ratio:auto;height:100dvh;border-radius:0}
.m-on .icons{left:3%;right:3%;top:2.8em;grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(4,1fr);justify-content:stretch;gap:.6em}
.m-on .ic{width:auto}.m-on .ic svg{width:3.4em}
.m-on .win{left:3%!important;top:2.6em!important;width:94%!important;height:72%!important}
.m-on .wall{object-position:32% 50%}.m-on .hint{white-space:normal;width:80%;text-align:center}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
.bezel{will-change:transform;transform:perspective(1600px) rotateX(calc(var(--my,0)*-5deg)) rotateY(calc(var(--mx,0)*7deg))}
.wall{filter:saturate(1.45) contrast(1.08) brightness(1.05);transform:translate(calc(var(--mx,0)*-1.8%),calc(var(--my,0)*-1.8%)) scale(1.08)}
.tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(135deg,#ff8fd0,#8fd8ff 60%,#ffe08a);opacity:.4}
.deco{position:absolute;inset:0;pointer-events:none;z-index:1;transform:translate(calc(var(--mx,0)*2.4%),calc(var(--my,0)*2.4%))}
.deco i{position:absolute;font-style:normal;color:#fff;font-size:1.8em;text-shadow:0 0 .6em #ff9fd4,0 0 .2em #fff;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-.5em) scale(1.2);opacity:.6}}
.glare{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle at calc(50% + var(--mx,0)*40%) calc(50% + var(--my,0)*40%),#ffffff30,transparent 45%)}
.stk{position:absolute;left:3%;bottom:7%;background:#fff;color:#ff4f9a;font-weight:800;padding:.3em .8em;border-radius:1.5em;transform:rotate(-8deg);box-shadow:0 .2em .6em #0004,0 0 0 .25em #fff;font-size:1.3em;z-index:1;pointer-events:none}
.ic{position:absolute;touch-action:none;cursor:grab}.ic.grab{cursor:grabbing}.ic.grab svg{transform:scale(1.12) rotate(-4deg)}
@media (prefers-reduced-motion:reduce){.deco i{animation:none}}
</style>
</head>

function win(title,html,cls){
 const w=document.createElement("div");w.className="win";w.style.zIndex=++z;
 const r=scr.getBoundingClientRect(),k=n++%6;
 w.style.left=(r.width*0.08+k*28)+"px";w.style.top=(r.height*0.1+k*24+28)+"px";
 w.innerHTML=`<div class="tb"><button class="dot r" aria-label="Закрыть"></button><button class="dot y" aria-label="Свернуть"></button><button class="dot g" aria-label="Развернуть"></button><span class="t">${title}</span></div><div class="body ${cls||""}"></div>`;
 w.querySelector(".body").innerHTML=html;scr.appendChild(w);
 w.addEventListener("pointerdown",()=>{w.style.zIndex=++z;document.getElementById("mbApp").textContent=title});
 w.querySelector(".r").onclick=()=>w.remove();
 w.querySelector(".y").onclick=()=>w.remove();
 w.querySelector(".g").onclick=()=>w.classList.toggle("full");
 const tb=w.querySelector(".tb");let d=null;
 tb.addEventListener("pointerdown",e=>{if(e.target.closest(".dot")||w.classList.contains("full"))return;d={x:e.clientX-w.offsetLeft,y:e.clientY-w.offsetTop};tb.setPointerCapture(e.pointerId);tb.style.cursor="grabbing";DRAG=true});
 tb.addEventListener("pointermove",e=>{if(!d)return;const R=scr.getBoundingClientRect();
  w.style.left=Math.max(-w.offsetWidth+80,Math.min(R.width-80,e.clientX-d.x))+"px";w.style.top=Math.max(28,Math.min(R.height-40,e.clientY-d.y))+"px"});
 tb.addEventListener("pointerup",()=>{d=null;DRAG=false;tb.style.cursor=""});
 return w;
}
function openFolder(id){

 const g=w.querySelector(".files");
 F.f.forEach(([name,type,html])=>{const b=document.createElement("button");b.className="f";b.innerHTML=fileSvg(type)+name;
  b.onclick=()=>{const v=win(name,html);v.style.left=parseFloat(w.style.left)+40+"px";v.style.top=parseFloat(w.style.top)+34+"px";v.style.width="42em"};g.appendChild(b)});
 if(F.f.length==1&&id!="photo"&&id!="resume"){}
 if(id=="resume"){w.style.width="30em";w.style.height="14em"}
}

/* перетаскиваемые папки */
(function(){
 const sr=scr.getBoundingClientRect();
 const ics=[...document.querySelectorAll(".ic")];
 const mob=document.body.classList.contains("m-on"),em=parseFloat(scr.style.fontSize)||13;const pos=ics.map((b,i)=>{if(mob){const c=i%4,r=Math.floor(i/4);return [3+c*24.5,(2.6+r*5.8)*em/sr.height*100,23]}return [2.5+i*86.2/(ics.length-1),2.8*em/sr.height*100,8.8]});
 ics.forEach((b,i)=>{
  b.style.left=pos[i][0]+"%";b.style.top=pos[i][1]+"%";b.style.width=pos[i][2]+"%";b.style.zIndex=2;scr.appendChild(b);
  const open=()=>{openFolder(b.dataset.id);document.getElementById("hint").style.opacity=0};
  let moved=false;
  b.addEventListener("click",()=>{if(moved){moved=false;return}open()});
  b.addEventListener("pointerdown",e=>{
   if(e.button)return;
   const s={x:e.clientX,y:e.clientY,l:parseFloat(b.style.left),t:parseFloat(b.style.top),m:false};
   moved=false;
   const mv=ev=>{const dx=ev.clientX-s.x,dy=ev.clientY-s.y;
    if(!s.m&&Math.hypot(dx,dy)>9){s.m=true;moved=true;DRAG=true;b.classList.add("grab");b.style.zIndex=5}
    if(s.m){const R=scr.getBoundingClientRect(),wP=b.offsetWidth/R.width*100,hP=b.offsetHeight/R.height*100;
     b.style.left=Math.max(0,Math.min(100-wP,s.l+dx/R.width*100))+"%";
     b.style.top=Math.max(4.5,Math.min(100-hP,s.t+dy/R.height*100))+"%"}};
   const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
    DRAG=false;b.classList.remove("grab");b.style.zIndex=2;setTimeout(()=>{moved=false},0)};
   addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up);
  });
 });
 document.getElementById("icons").remove();
})();

/* 3D-наклон за мышкой */
(function(){
 if(!matchMedia("(pointer:fine)").matches||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 let tx=0,ty=0,cx=0,cy=0;const st=document.body.style;
 addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1});
 document.documentElement.addEventListener("mouseleave",()=>{tx=ty=0});
 (function loop(){const k=(DRAG||document.body.classList.contains("m-on"))?0:1;
  cx+=(tx*k-cx)*.08;cy+=(ty*k-cy)*.08;
  st.setProperty("--mx",cx.toFixed(3));st.setProperty("--my",cy.toFixed(3));requestAnimationFrame(loop)})();
})();
